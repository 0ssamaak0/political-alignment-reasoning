# Per-tag steering configuration for `mistral-pvsteer-*` tags.
#
# Fields:
#   vector_path:  Path (relative to repo root) to a [num_layers+1, d_model]
#                 tensor saved by 3_persona_vectors/shared/compute_persona_vector.py.
#                 The 0th row is the embedding output; rows 1..N are
#                 post-block residuals.
#   layer_idx:    1-indexed row of v_full to use as the steering vector.
#                 Equal to the model.layers index + 1.
#                 NOTE: ActivationSteerer's API is 0-indexed; the
#                 steering_context() helper subtracts 1 when forwarding.
#                 STAGE-A FILLS THIS IN (placeholder 0 means "not yet computed").
#   coeff:        Steering coefficient. h_layer += coeff * v_layer.
#                 Positive coefficient with a *_leaning_response_avg_diff.pt
#                 vector induces that leaning.
#   positions:    "all" — add at every token position (paper default).
#                 "prompt" / "response" — see ref_impl/activation_steer.py.

mistral-pvsteer-left-a3:
  vector_path: 3_persona_vectors/shared/vectors/mistral/left_leaning_response_avg_diff.pt
  layer_idx: 17     # filled by Stage A
  coeff: 3.0
  positions: all

mistral-pvsteer-left-a5:
  vector_path: 3_persona_vectors/shared/vectors/mistral/left_leaning_response_avg_diff.pt
  layer_idx: 17     # filled by Stage A
  coeff: 5.0
  positions: all

mistral-pvsteer-left-a7:
  vector_path: 3_persona_vectors/shared/vectors/mistral/left_leaning_response_avg_diff.pt
  layer_idx: 17     # filled by Stage A
  coeff: 7.0
  positions: all

mistral-pvsteer-right-a3:
  vector_path: 3_persona_vectors/shared/vectors/mistral/right_leaning_response_avg_diff.pt
  layer_idx: 9     # filled by Stage A (may differ from left)
  coeff: 3.0
  positions: all

mistral-pvsteer-right-a5:
  vector_path: 3_persona_vectors/shared/vectors/mistral/right_leaning_response_avg_diff.pt
  layer_idx: 9     # filled by Stage A
  coeff: 5.0
  positions: all

mistral-pvsteer-right-a7:
  vector_path: 3_persona_vectors/shared/vectors/mistral/right_leaning_response_avg_diff.pt
  layer_idx: 9     # filled by Stage A
  coeff: 7.0
  positions: all

# --- Multi-layer cells (paper §A.3 — pvsteer-ml) -----------------------------
# layers="1-31" + vector_mode=incremental hooks every block except final
# (skip L32 due to row-32 magnitude anomaly; mirrors pv3A).
#
# Stage A coef sweep over α ∈ {2, 3, 4, 5, 8, 12} found a sharp coherence cliff
# between α=3 and α=4 for both directions. Only α=3 is "very politicized" at
# preserved coherence:
#   left  α=3: trait=94.0 coh=70.0   (α=2: trait=91 coh=71.5, similar; α=4: coh=18.5)
#   right α=3: trait=79.5 coh=80.0   (α=2: trait=40.5 weak; α=4: coh=24.0)
# See results/coef_sweep/sweep_{left,right}.json for the full curve.

mistral-pvsteer-ml-left-a3:
  vector_path: 3_persona_vectors/shared/vectors/mistral/left_leaning_response_avg_diff.pt
  layers: "1-31"
  vector_mode: incremental
  coeff: 3.0
  positions: all

mistral-pvsteer-ml-right-a3:
  vector_path: 3_persona_vectors/shared/vectors/mistral/right_leaning_response_avg_diff.pt
  layers: "1-31"
  vector_mode: incremental
  coeff: 3.0
  positions: all

# --- α=4 cells (RQ3 strength sweep, past the coherence cliff). At α=4 coherence
# collapses (Mistral-L 11.2, Mistral-R 24.2); included to capture the
# generation-collapse end of the dose-response.
mistral-pvsteer-ml-left-a4:
  vector_path: 3_persona_vectors/shared/vectors/mistral/left_leaning_response_avg_diff.pt
  layers: "1-31"
  vector_mode: incremental
  coeff: 4.0
  positions: all

mistral-pvsteer-ml-right-a4:
  vector_path: 3_persona_vectors/shared/vectors/mistral/right_leaning_response_avg_diff.pt
  layers: "1-31"
  vector_mode: incremental
  coeff: 4.0
  positions: all

# --- Relaxed α=2 cells (pv3C analogy — subthreshold coef to reduce collapse).
# Stage A trait/coh on personality questions:
#   left  α=2: trait=91.0 coh=71.5   (≈ α=3's 94/70 — strong stance)
#   right α=2: trait=40.5 coh=87.5   (much weaker stance; included for symmetry)
# Hypothesis: lower α reduces f4 collapse rate (was 25.6% on ml-left-a3)
# while preserving most of the contamination signal.

mistral-pvsteer-ml-left-a2:
  vector_path: 3_persona_vectors/shared/vectors/mistral/left_leaning_response_avg_diff.pt
  layers: "1-31"
  vector_mode: incremental
